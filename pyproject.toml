[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injuryrisk"
version = "0.1.0"
description = "NBA short-horizon injury risk from public box scores and transaction logs"
requires-python = ">=3.10"
# Lower bounds are the oldest versions expected to work; upper bounds stop a
# major-version jump. Tested with pandas 3.0, numpy 2.4, scikit-learn 1.8,
# scipy 1.17, matplotlib 3.11.
dependencies = [
    "pandas>=2.0,<4",
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
    "pyyaml>=6.0,<7",
    "nba_api>=1.4,<2",
]

[project.optional-dependencies]
shap = ["shap>=0.44"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
