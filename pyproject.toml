[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injuryrisk"
version = "0.1.0"
description = "NBA short-horizon injury risk from public box scores and transaction logs"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "nba_api>=1.4",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
shap = ["shap>=0.44"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
